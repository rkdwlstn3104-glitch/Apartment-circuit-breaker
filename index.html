<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="차단기안내" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>마을 아파트 차단기 현황 및 진입 안내</title>
    <meta name="description" content="마을별 아파트 차량 차단기 설치 여부를 확인하고 차단기 보유 아파트를 PDF 안내 페이지와 바로 연결하여 확인하는 서비스" />
    <meta property="og:title" content="마을 아파트 차단기 현황 및 진입 안내" />
    <meta property="og:description" content="마을별 아파트 차량 차단기 설치 여부를 확인하고 차단기 보유 아파트를 PDF 안내 페이지와 바로 연결하여 확인하는 서비스" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <script>
      // Ignore Vite HMR WebSocket connection messages in AI Studio preview iframe
      (function() {
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args[0] && typeof args[0] === 'string' && (args[0].indexOf('[vite]') !== -1 || args[0].indexOf('WebSocket') !== -1)) {
            return;
          }
          origError.apply(console, args);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args[0] && typeof args[0] === 'string' && (args[0].indexOf('[vite]') !== -1 || args[0].indexOf('WebSocket') !== -1)) {
            return;
          }
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.indexOf('[vite]') !== -1 || e.message.indexOf('WebSocket') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
