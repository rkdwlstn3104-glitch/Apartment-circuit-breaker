<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="barrierArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Apartment Buildings Silhouette -->
  <rect x="80" y="160" width="80" height="230" rx="8" fill="#6366f1" opacity="0.4" />
  <rect x="180" y="120" width="100" height="270" rx="8" fill="#818cf8" opacity="0.6" />
  <rect x="300" y="190" width="90" height="200" rx="8" fill="#6366f1" opacity="0.4" />
  
  <!-- Barrier Post -->
  <rect x="100" y="270" width="36" height="130" rx="6" fill="#f8fafc" />
  <circle cx="118" cy="285" r="12" fill="#fbbf24" />
  
  <!-- Barrier Arm (Down / Controlled) -->
  <rect x="118" y="278" width="280" height="16" rx="4" fill="url(#barrierArm)" transform="rotate(-12 118 285)" stroke="#1e1b4b" stroke-width="2" />

  <!-- Car Symbol -->
  <g transform="translate(180, 310)">
    <rect x="20" y="30" width="120" height="35" rx="10" fill="#ffffff" />
    <path d="M 35 30 L 50 10 L 105 10 L 120 30 Z" fill="#e0e7ff" />
    <circle cx="45" cy="65" r="14" fill="#0f172a" />
    <circle cx="45" cy="65" r="6" fill="#94a3b8" />
    <circle cx="115" cy="65" r="14" fill="#0f172a" />
    <circle cx="115" cy="65" r="6" fill="#94a3b8" />
  </g>
</svg>
